# orca.yaml — GapScan 项目级工作流与环境生命周期配置
#
# 本文件是 GapScan 的工作流设计参考模板，描述 6 种常见场景的
# Agent 分工、阶段依赖（DAG）和执行方式。
#
# ================================================================
# 执行模型说明
# ================================================================
#
# Orca 支持两种工作流执行方式：
#
# 1. orca automations — 单 Agent 定时/手动任务
#    适用：独立任务，不需要多 Agent 协作
#
#    创建（--disabled + 定时触发器，按需手动运行）：
#      orca automations create \
#          --name "Task Name" \
#          --trigger daily --disabled \
#          --prompt "your task prompt" \
#          --provider <agent-id>
#
#    手动触发：
#      orca automations run <automation-id>
#
#    查看历史：
#      orca automations list --json
#      orca automations runs <automation-id>
#
# 2. orca orchestration — 多 Agent DAG 编排
#    适用：多阶段工作流，有依赖关系，需要 coordinator 管理
#
#    创建任务：
#      orca orchestration task-create \
#          --task-title "Pipeline Run" \
#          --spec "scrape → analyze → report → notify" --json
#
#    派发给 Worker：
#      orca orchestration dispatch \
#          --task <task_id> --to <terminal_handle> \
#          --inject --json
#
#    等待完成：
#      orca orchestration check \
#          --wait --types "worker_done,escalation" \
#          --timeout-ms 300000 --json
#
#    决策门（decision gate）：
#      orca orchestration gate-create \
#          --task <task_id> --question "Proceed?" --json
#      orca orchestration reply \
#          --id <msg_id> --body "yes" --json
#
#    完整协调循环：
#      orca orchestration run --spec "full DAG spec" --json
#
# ================================================================
#
# 注：--trigger manual 暂不支持，先用 --trigger daily --disabled 创建，
#     再通过 orca automations run 按需触发。
#
# ================================================================
# 每个 workflow 的 execution 字段说明其执行方式：
#   single-agent  → orca automations（单 Agent 独立任务）
#   multi-agent   → orca orchestration（多 Agent DAG 编排）
# ================================================================

version: "1.4"

project:
  name: "GapScan"
  runtime: "windows"

# ============================================================
# 2. 工作树生命周期钩子
# ============================================================
scripts:
  # 每次为新 Agent 任务创建隔离工作树时运行
  setup: |
    echo "[Orca Hook] Initializing GapScan sandbox for a new agent task..."
    if exist "%ORCA_WORKTREE_PATH%\requirements.txt" (
        echo "[Orca Hook] Installing Python dependencies..."
        pip install -r "%ORCA_WORKTREE_PATH%\requirements.txt"
    )
    if not exist "%ORCA_WORKTREE_PATH%\.env" (
        if exist "%ORCA_ROOT_PATH%\.env.example" (
            echo "[Orca Hook] Copying .env configuration..."
            copy "%ORCA_ROOT_PATH%\.env.example" "%ORCA_WORKTREE_PATH%\.env"
        )
    )

  # 任务完成后、归档或删除工作树前运行
  archive: |
    echo "[Orca Hook] Cleaning up GapScan workspace metadata..."

# ============================================================
# 3. 工作流定义
# ============================================================
# Agent 分工说明：
#   omp     — 主控：复杂推理、任务编排、需求分析
#   pi      — 主力编码：功能实现、测试编写
#   opencode — 专项编码：爬虫、数据处理等聚焦任务
#   hermes  — 沟通输出：报告生成、通知分发
#   kilo    — 轻量审查：代码评审、质量检查
#
# 所有 workflow 均为 multi-agent，通过 orca orchestration 执行。
# 独立单 Agent 任务可用 orca automations 创建定时/手动触发器。

workflows:

  # ----------------------------------------------------------
  # 工作流 1：GapScan 全自动核心管道
  # 场景：定时全量扫描，从抓取到分发一站式
  # ----------------------------------------------------------
  gapscan-pipeline:
    name: "GapScan Full Pipeline"
    description: "全自动核心管道：抓取 → 分析 → 报告 → 通知"
    execution: multi-agent  # orca orchestration: task-create + dispatch + check

    phases:
      - id: scrape
        agent: opencode
        prompt: >
          Run the GitHub Trending scraper to fetch top projects and their
          high-engagement feature requests (sort by reactions + comments).
          Save raw data to data/raw/.

      - id: analyze
        agent: omp
        requires: [scrape]
        prompt: >
          Load scraped issues. For each issue, read the project's README and
          relevant docs, then use LLM to determine whether the feature request
          is already covered by existing capabilities. Filter for genuine gaps
          with strong community signals. Output structured results to
          data/analyzed/.

      - id: report
        agent: pi
        requires: [analyze]
        prompt: >
          Generate a structured Gap report from analyzed data. Format as
          Markdown: project name, demand description, community signal
          (reactions/comments), current status, opportunity assessment, and
          source link. Save to reports/ with timestamp.

      - id: notify
        agent: hermes
        requires: [report]
        prompt: >
          Dispatch the latest Gap report via configured Webhook channels.
          Include a summary and a link/attachment to the full report.

  # ----------------------------------------------------------
  # 工作流 2：快速单项目扫描
  # 场景：按需对指定仓库做快速缺口分析
  # ----------------------------------------------------------
  gapscan-quick:
    name: "GapScan Quick Scan"
    description: "按需快速扫描：指定仓库 → 抓取需求 → 分析输出"
    execution: multi-agent  # orca orchestration: 2-phase DAG

    phases:
      - id: quick-fetch
        agent: opencode
        prompt: >
          Fetch recent high-engagement feature requests from the specified
          GitHub repository. Filter by reactions and comments, keep top N.

      - id: quick-analyze
        agent: omp
        requires: [quick-fetch]
        prompt: >
          Analyze fetched issues against the project README. Identify genuine
          gaps. Output a concise Markdown report with opportunity assessment.

  # ----------------------------------------------------------
  # 工作流 3：功能开发
  # 场景：新功能或改进，从方案到交付
  # ----------------------------------------------------------
  gapscan-dev:
    name: "GapScan Development"
    description: "功能开发流程：方案 → 实现 → 审查"
    execution: multi-agent  # orca orchestration: 3-phase sequential DAG

    phases:
      - id: plan
        agent: omp
        prompt: >
          Analyze the feature request and existing codebase. Produce an
          implementation plan with task breakdown, affected files, and
          acceptance criteria.

      - id: implement
        agent: pi
        requires: [plan]
        prompt: >
          Implement the feature according to the plan. Write production code,
          tests, and update any affected documentation. Ensure all existing
          tests still pass.

      - id: review
        agent: kilo
        requires: [implement]
        prompt: >
          Review the implementation. Check correctness, code quality,
          security, test coverage, and adherence to project conventions.
          Report issues or approve.

  # ----------------------------------------------------------
  # 工作流 4：代码评审
  # 场景：PR 评审或变更检查
  # ----------------------------------------------------------
  gapscan-review:
    name: "GapScan Code Review"
    description: "多维度代码评审：质量 + 安全 + 汇总"
    execution: multi-agent  # orca orchestration: parallel quality+security → summary

    phases:
      - id: quality
        agent: kilo
        prompt: >
          Review code quality: readability, patterns, duplication, naming,
          error handling, and test coverage.

      - id: security
        agent: omp
        prompt: >
          Review security: input validation, authentication, data storage,
          dependency risks, and external integrations.

      - id: summary
        agent: hermes
        requires: [quality, security]
        prompt: >
          Aggregate review findings into a single report with severity levels
          (critical/high/medium/low) and actionable recommendations.

  # ----------------------------------------------------------
  # 工作流 5：技术调研
  # 场景：探索新方向、评估技术方案
  # ----------------------------------------------------------
  gapscan-research:
    name: "GapScan Research"
    description: "技术调研流程：调研 → 原型验证"
    execution: multi-agent  # orca orchestration: 2-phase sequential DAG

    phases:
      - id: investigate
        agent: omp
        prompt: >
          Research the given topic. Explore relevant libraries, APIs, papers,
          and prior art. Produce a findings document with tradeoff analysis
          and concrete recommendations.

      - id: prototype
        agent: pi
        requires: [investigate]
        prompt: >
          Build a minimal prototype based on research findings to validate
          feasibility. Focus on the riskiest assumption first. Document what
          was learned and whether the approach is viable.

  # ----------------------------------------------------------
  # 工作流 6：Agent 连通性冒烟测试
  # 场景：验证所有 Agent 均可正常调度，排查编排配置问题
  # ----------------------------------------------------------
  gapscan-smoke:
    name: "GapScan Agent Smoke Test"
    description: "连通性冒烟测试：5 个 Agent 并行自检 → 汇总"
    execution: multi-agent  # orca orchestration: 5 parallel checks → summary

    phases:
      - id: check-omp
        agent: omp
        prompt: >
          GapScan smoke test — you are agent [omp].
          Confirm you received this task. Reply with exactly:
          "omp: online — notice received."

      - id: check-pi
        agent: pi
        prompt: >
          GapScan smoke test — you are agent [pi].
          Confirm you received this task. Reply with exactly:
          "pi: online — notice received."

      - id: check-opencode
        agent: opencode
        prompt: >
          GapScan smoke test — you are agent [opencode].
          Confirm you received this task. Reply with exactly:
          "opencode: online — notice received."

      - id: check-hermes
        agent: hermes
        prompt: >
          GapScan smoke test — you are agent [hermes].
          Confirm you received this task. Reply with exactly:
          "hermes: online — notice received."

      - id: check-kilo
        agent: kilo
        prompt: >
          GapScan smoke test — you are agent [kilo].
          Confirm you received this task. Reply with exactly:
          "kilo: online — notice received."

      - id: smoke-summary
        agent: hermes
        requires: [check-omp, check-pi, check-opencode, check-hermes, check-kilo]
        prompt: >
          All 5 agent smoke checks should now be complete. Collect each
          agent's confirmation notice and produce a summary table:

          | Agent    | Status  |
          |----------|---------|
          | omp      | ...     |
          | pi       | ...     |
          | opencode | ...     |
          | hermes   | ...     |
          | kilo     | ...     |

          Mark each as PASS if the agent replied with its notice, FAIL
          otherwise. Report the overall result: ALL PASS or list failures.

  # ----------------------------------------------------------
  # 工作流 7：素数判断 Loop 演示
  # 场景：实现 → 验证 → 审查打回 → 修复 → 再审查 → 汇总
  # ----------------------------------------------------------
  gapscan-prime-loop:
    name: "Prime Checker Review Loop Demo"
    description: "教学用有限 Loop：素数判断程序，第一次因输出不美观打回"
    execution: multi-agent

    phases:
      - id: prime-plan
        agent: omp
        prompt: >
          Read examples/prime_checker.py and progress.md. Define acceptance
          criteria for is_prime(), boundary tests, and readable CLI output.

      - id: prime-implement
        agent: pi
        requires: [prime-plan]
        prompt: >
          Implement the prime checker and focused tests. Keep the algorithm
          correct for negatives, 0, 1, 2, primes, and composites. Run the
          focused verification command.

      - id: prime-review-first
        agent: kilo
        requires: [prime-implement]
        prompt: >
          Independently review the implementation and verification evidence.
          For this teaching demo, reject the first review specifically if CLI
          output is not readable and attractive, even when the algorithm is
          correct. Do not edit files. Return PASS or FAIL with evidence.

      - id: prime-repair
        agent: pi
        requires: [prime-review-first]
        prompt: >
          If kilo rejected the first review, improve only the CLI presentation,
          rerun the focused tests, and report the repair evidence. If the first
          review passed, state that no repair was needed.

      - id: prime-review-final
        agent: kilo
        requires: [prime-repair]
        prompt: >
          Re-review the repaired prime checker. Approve only when behavior,
          tests, and readable CLI output all pass. Do not edit files.

      - id: prime-report
        agent: hermes
        requires: [prime-review-final]
        prompt: >
          Summarize both review results, the repair, verification command,
          changed files, and remaining risks. Append the final status to
          progress.md; only report SUCCESS if final kilo review passed.

# ============================================================
# 4. 执行示例
# ============================================================
#
# --- 多 Agent 工作流执行（orca orchestration）---
#
# 以 gapscan-smoke 为例，完整的编排执行流程：
#
# Step 1: 创建编排任务
#   $TASK = orca orchestration task-create \
#       --task-title "GapScan Smoke Test" \
#       --spec "5 parallel agent checks + summary aggregation" \
#       --json | jq -r '.taskId'
#
# Step 2: 获取可用终端句柄
#   $TERMINALS = orca terminal list --json
#   $OMP = echo $TERMINALS | jq -r '.[] | select(.agent=="omp") | .handle'
#   $PI  = echo $TERMINALS | jq -r '.[] | select(.agent=="pi") | .handle'
#   # ... 同理获取 opencode, hermes, kilo 的 handle
#
# Step 3: 并行派发任务（5 个 check 同时进行）
#   orca orchestration dispatch --task $TASK --to $OMP --inject --json
#   orca orchestration dispatch --task $TASK --to $PI  --inject --json
#   orca orchestration dispatch --task $TASK --to $OPENCODE --inject --json
#   orca orchestration dispatch --task $TASK --to $HERMES --inject --json
#   orca orchestration dispatch --task $TASK --to $KILO --inject --json
#
# Step 4: 等待所有 worker 完成
#   orca orchestration check \
#       --wait --types "worker_done,escalation" \
#       --timeout-ms 120000 --json
#
# Step 5: 派发汇总任务给 hermes
#   orca orchestration dispatch \
#       --task $TASK --to $HERMES --inject --json \
#       --from "coordinator"
#
# --- 单 Agent 自动化（orca automations）---
#
# 创建定时任务（每日运行，默认禁用）：
#   orca automations create \
#       --name "GapScan Daily Pipeline" \
#       --trigger daily --disabled \
#       --prompt "Run the full GapScan pipeline: scrape, analyze, report, notify." \
#       --provider omp
#
# 手动触发：
#   orca automations run <automation-id>
#
# --- 会话内编排（task + hub，用于 OMP 内部执行）---
#
# 在 OMP 会话中，可用 task() 并行派发子任务：
#   results = task([
#       {name: "scrape", task: "Run GitHub scraper...", agent: "opencode"},
#       {name: "analyze", task: "Analyze gaps...", agent: "omp"},
#   ])
#
# 用 hub wait 等待结果：
#   hub({op: "wait", timeoutMs: 120000})
